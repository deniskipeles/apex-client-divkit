name: Build & Release DivKit SDUI POS APKs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build Multi-Architecture APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list starts with the legacy `tools` package,
          # which Google removed from the SDK repo; sdkmanager then fails with
          # "Failed to find package 'tools'". The next step installs what we need.
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses & Install Platform Tools
        run: |
          yes | sdkmanager --licenses || true
          # build.gradle.kts compiles against API 36 minor level 1.
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Setup Environment Files
        working-directory: apps/android
        run: |
          # Create placeholder .env to satisfy the Secrets Gradle Plugin if not present
          touch .env
          if [ ! -f .env.example ]; then
            touch .env.example
          fi

      - name: Ensure Executable Permissions
        working-directory: apps/android
        run: |
          chmod +x gradlew
          chmod +x build-apks.sh

      # The prod channel ships `assets/demo/<id>/workspace.bin` encrypted with AES-256-GCM and
      # refuses to build without a key. Forward the repository secret when it exists; otherwise
      # mint a per-run key so the pipeline still produces installable (encrypted) APKs. The key is
      # embedded in the APK's BuildConfig, so it never leaves the artifact.
      - name: Resolve workspace encryption key
        env:
          SECRET_KEY: ${{ secrets.APEX_WORKSPACE_KEY }}
        run: |
          if [ -n "${SECRET_KEY:-}" ]; then
            echo "Using the APEX_WORKSPACE_KEY repository secret."
            echo "::add-mask::${SECRET_KEY}"
            echo "APEX_WORKSPACE_KEY=${SECRET_KEY}" >> "$GITHUB_ENV"
          else
            echo "::warning::APEX_WORKSPACE_KEY is not set; generating a per-run workspace key. Add the repository secret to keep release keys stable across builds."
            KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
            echo "::add-mask::${KEY}"
            echo "APEX_WORKSPACE_KEY=${KEY}" >> "$GITHUB_ENV"
          fi

      - name: Compile and Package Release APKs
        working-directory: apps/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/apps/android/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'storepass123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'storepass123' }}
        run: |
          # Executes the automated build engine in --release mode for the prod channel only:
          # produces arm64-v8a, armeabi-v7a, x86_64, and universal APKs + checksums.sha256 in ./dist-apks/
          # The dev channel is plaintext on purpose, so it must never be published as a release.
          ./build-apks.sh --release --channel prod --output-dir "${{ github.workspace }}/dist-apks"

      - name: Display Artifacts & Checksums
        run: |
          echo "### Generated Build Artifacts"
          ls -lh dist-apks/
          echo ""
          echo "### SHA-256 Checksums"
          cat dist-apks/checksums.sha256

      # Each ABI is published as its own artifact so a download pulls only the
      # architecture that is actually needed instead of the whole multi-ABI bundle.
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: divkit-sdui-pos-arm64-v8a-${{ github.ref_name }}
          path: dist-apks/*-prod-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: divkit-sdui-pos-armeabi-v7a-${{ github.ref_name }}
          path: dist-apks/*-prod-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: divkit-sdui-pos-x86_64-${{ github.ref_name }}
          path: dist-apks/*-prod-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: divkit-sdui-pos-universal-${{ github.ref_name }}
          path: dist-apks/*-prod-universal-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: divkit-sdui-pos-checksums-${{ github.ref_name }}
          path: dist-apks/checksums.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DivKit SDUI POS Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: |
            dist-apks/*.apk
            dist-apks/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}