name: Build & Test Web + Desktop

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web dashboard (Nitro) — typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Version comes from `packageManager` in the root package.json; setting it here too
      # makes pnpm fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm -C packages/pos-ui exec tsc --noEmit
          pnpm -C apps/web exec tsc --noEmit
          pnpm -C apps/desktop exec tsc --noEmit

      - name: Contract + shared-UI tests
        run: pnpm -C apps/web exec vitest run

      - name: Build web dashboard
        run: pnpm -C apps/web run build

      - name: Build desktop frontend bundle
        run: pnpm -C apps/desktop run build:web

  desktop:
    name: Desktop POS (Tauri v2) — cargo check + test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: cargo test (capability-routing guard)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
